<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Reviewer Leaderboard 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bbc-yellow: #ffd200;
            --bbc-black: #141414;
            --bbc-red: #b80000;
            --bbc-gray: #f6f6f6;
            --bbc-border: #e0e0e0;
        }
        body {
            font-family: ReithSans, Arial, Helvetica, sans-serif;
            background-color: var(--bbc-gray);
            color: #222;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--bbc-black);
            color: white;
            padding: 15px 30px;
            border-bottom: 4px solid var(--bbc-yellow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge {
            background: var(--bbc-yellow);
            color: var(--bbc-black);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .controls-bar {
            background: white;
            padding: 12px 30px;
            border-bottom: 1px solid var(--bbc-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .nav-tabs {
            display: flex;
            background: var(--bbc-black);
            padding: 0 30px;
            overflow-x: auto;
        }
        .tab-btn {
            background: none;
            border: none;
            color: white;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        .tab-btn:hover {
            background-color: #2a2a2a;
        }
        .tab-btn.active {
            border-bottom-color: var(--bbc-yellow);
            color: var(--bbc-yellow);
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background-color: var(--bbc-black);
            color: white;
            text-align: left;
            padding: 10px;
            font-size: 14px;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--bbc-border);
            font-size: 15px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .pos-1 { font-weight: bold; color: #d4af37; }
        .pos-2 { font-weight: bold; color: #707070; }
        .pos-3 { font-weight: bold; color: #cd7f32; }
        
        /* Form Badge Styles */
        .history-container {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .history-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 24px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            background-color: #e0e0e0;
            color: #333;
        }
        .history-gold {
            background-color: #ffd200;
            color: #000;
        }
        .history-silver {
            background-color: #c0c0c0;
            color: #000;
        }
        .history-bronze {
            background-color: #cd7f32;
            color: #fff;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: var(--bbc-gray);
            border-left: 4px solid var(--bbc-black);
            padding: 15px;
        }
        .card h4 {
            margin: 0 0 8px 0;
            color: #555;
            text-transform: uppercase;
            font-size: 12px;
        }
        .card .value {
            font-size: 24px;
            font-weight: bold;
        }
        .chart-box {
            margin-top: 30px;
            height: 400px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--bbc-red); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<header>
    <h1>DevOps Reviewer Championship 2026</h1>
    <span class="badge">BBC SPORT STYLE</span>
</header>

<div class="controls-bar">
    <div class="toggle-container">
        <span>Raw Reviews Only</span>
        <label class="switch">
            <input type="checkbox" id="modeToggle" onchange="renderAll()">
            <span class="slider"></span>
        </label>
        <span>Weighted by Story Points</span>
    </div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('championship', event)">Championship</button>
    <button class="tab-btn" onclick="switchTab('analytics', event)">Analytics & Potential</button>
    <!--MONTH_TABS-->
</div>

<div class="container">
    <div id="championship" class="tab-content active">
        <h2>Championship Leaderboard</h2>
        <div id="championship-table-container"></div>
    </div>

    <div id="analytics" class="tab-content">
        <h2>Season Analytics & Potential</h2>
        <div class="card-grid">
            <div class="card">
                <h4>Months Elapsed</h4>
                <div class="value" id="stat-elapsed">0 / 12</div>
            </div>
            <div class="card">
                <h4>Max Remaining Points</h4>
                <div class="value" id="stat-remaining-pts">0</div>
            </div>
            <div class="card">
                <h4>Current Leader</h4>
                <div class="value" id="stat-leader">-</div>
            </div>
        </div>
        <div class="chart-box">
            <canvas id="progressChart"></canvas>
        </div>
        <h3 style="margin-top:40px;">Max Potential Finish Matrix</h3>
        <div id="potential-table-container"></div>
    </div>

    <!--MONTH_CONTENTS-->
</div>

<script>
const data = <!--DATA_PAYLOAD-->;
let progressChart = null;

function isWeighted() {
    return document.getElementById('modeToggle').checked;
}

function switchTab(tabId, evt) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (evt) {
        evt.currentTarget.classList.add('active');
    }
}

function renderAll() {
    const mode = isWeighted() ? 'weighted' : 'unweighted';
    renderChampionship(mode);
    renderMonthly(mode);
    renderAnalytics(mode);
}

function renderChampionship(mode) {
    let elapsed = 0;
    for (let m = 1; m <= 12; m++) {
        if ((data.monthlyData[m] || []).length > 0) elapsed = m;
    }

    const stats = {};
    data.reviewers.forEach(r => {
        stats[r] = {
            totalPoints: 0,
            wins: 0,
            podiums: 0,
            history: []
        };
    });

    for (let m = 1; m <= 12; m++) {
        const monthList = data.monthlyData[m] || [];
        
        // Track history only up to the last active month
        data.reviewers.forEach(r => {
            const entry = monthList.find(x => x.reviewer === r);
            if (entry) {
                const pts = entry[mode].points;
                const rank = entry[mode].rank;
                if (m <= elapsed) {
                    stats[r].history.push(pts);
                }
                stats[r].totalPoints += pts;
                if (rank === 1) stats[r].wins += 1;
                if (rank <= 3 && rank > 0) stats[r].podiums += 1;
            } else if (m <= elapsed) {
                stats[r].history.push(0);
            }
        });
    }

    const sorted = Object.keys(stats)
        .map(r => ({ reviewer: r, ...stats[r] }))
        .sort((a, b) => b.totalPoints - a.totalPoints || b.wins - a.wins || b.podiums - a.podiums);

    let html = `<table><thead><tr>
        <th>Pos</th>
        <th>Reviewer</th>
        <th>Wins</th>
        <th>Podiums</th>
        <th>Points History (M1 - M${elapsed})</th>
        <th>Total Points</th>
    </tr></thead><tbody>`;

    sorted.forEach((item, index) => {
        const posClass = index === 0 ? 'pos-1' : index === 1 ? 'pos-2' : index === 2 ? 'pos-3' : '';
        
        let historyBoxes = '<div class="history-container">';
        item.history.forEach(pts => {
            let colorClass = '';
            if (pts === 25) colorClass = 'history-gold';
            else if (pts === 18) colorClass = 'history-silver';
            else if (pts === 15) colorClass = 'history-bronze';

            historyBoxes += `<span class="history-box ${colorClass}">${pts > 0 ? pts.toFixed(0) : '-'}</span>`;
        });
        historyBoxes += '</div>';

        html += `<tr>
            <td class="${posClass}">${index + 1}</td>
            <td><strong>${item.reviewer}</strong></td>
            <td>${item.wins}</td>
            <td>${item.podiums}</td>
            <td>${historyBoxes}</td>
            <td><strong>${item.totalPoints.toFixed(1)}</strong></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('championship-table-container').innerHTML = html;
}

function renderMonthly(mode) {
    for (let m = 1; m <= 12; m++) {
        const monthList = data.monthlyData[m] || [];
        const sorted = [...monthList].sort((a, b) => a[mode].rank - b[mode].rank);

        let html = `<table><thead><tr>
            <th>Pos</th>
            <th>Reviewer</th>
            <th>Total Reviews</th>
            <th>Total Story Points</th>
            <th>Calculated Score</th>
            <th>F1 Points</th>
        </tr></thead><tbody>`;

        if (sorted.length === 0) {
            html += `<tr><td colspan="6">No reviews recorded for this month.</td></tr>`;
        } else {
            sorted.forEach(item => {
                html += `<tr>
                    <td>${item[mode].rank}</td>
                    <td><strong>${item.reviewer}</strong></td>
                    <td>${item.count}</td>
                    <td>${item.story_points.toFixed(1)}</td>
                    <td>${item[mode].score.toFixed(1)}</td>
                    <td><strong>${item[mode].points.toFixed(1)}</strong></td>
                </tr>`;
            });
        }
        html += `</tbody></table>`;
        document.getElementById(`month-table-${m}`).innerHTML = html;
    }
}

function renderAnalytics(mode) {
    let elapsed = 0;
    for (let m = 1; m <= 12; m++) {
        if ((data.monthlyData[m] || []).length > 0) elapsed = m;
    }

    const remainingMonths = 12 - elapsed;
    const maxRemainingPts = remainingMonths * 25;

    document.getElementById('stat-elapsed').innerText = `${elapsed} / 12`;
    document.getElementById('stat-remaining-pts').innerText = maxRemainingPts;

    const cumPoints = {};
    data.reviewers.forEach(r => cumPoints[r] = Array(12).fill(0));

    data.reviewers.forEach(r => {
        let run = 0;
        for (let m = 1; m <= 12; m++) {
            const found = (data.monthlyData[m] || []).find(x => x.reviewer === r);
            if (found) run += found[mode].points;
            cumPoints[r][m - 1] = run;
        }
    });

    const currentStandings = data.reviewers.map(r => ({
        reviewer: r,
        pts: cumPoints[r][11]
    })).sort((a, b) => b.pts - a.pts);

    document.getElementById('stat-leader').innerText = currentStandings[0] ? `${currentStandings[0].reviewer} (${currentStandings[0].pts.toFixed(1)} pts)` : 'N/A';

    const datasets = data.reviewers.map((r, i) => {
        const colors = ['#b80000', '#ffd200', '#005ace', '#008000', '#800080', '#ff69b4', '#a52a2a', '#808080'];
        return {
            label: r,
            data: cumPoints[r],
            borderColor: colors[i % colors.length],
            fill: false,
            tension: 0.1
        };
    });

    if (progressChart) progressChart.destroy();
    const ctx = document.getElementById('progressChart').getContext('2d');
    progressChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.months,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { title: { display: true, text: 'Championship Point Trajectory' } }
        }
    });

    let potHtml = `<table><thead><tr><th>Reviewer</th><th>Current Points</th><th>Max Possible Points</th><th>Highest Potential Finish</th></tr></thead><tbody>`;
    
    currentStandings.forEach(item => {
        const maxPossible = item.pts + maxRemainingPts;
        const highestPos = currentStandings.filter(other => other.pts > maxPossible).length + 1;

        potHtml += `<tr>
            <td><strong>${item.reviewer}</strong></td>
            <td>${item.pts.toFixed(1)}</td>
            <td>${maxPossible.toFixed(1)}</td>
            <td><strong>Pos ${highestPos}</strong></td>
        </tr>`;
    });
    potHtml += `</tbody></table>`;
    document.getElementById('potential-table-container').innerHTML = potHtml;
}

window.onload = function() {
    renderAll();
};
</script>

</body>
</html>
